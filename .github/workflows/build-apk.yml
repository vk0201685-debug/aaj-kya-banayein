name: Build & Release Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/Aaj-Kya-Banayein-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aaj-Kya-Banayein-Debug-APK
          path: release-apk/Aaj-Kya-Banayein-debug.apk
          retention-days: 14

      - name: Create GitHub Release & Upload APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "Aaj Kya Banayein - Android App v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          files: release-apk/Aaj-Kya-Banayein-debug.apk
          body: |
            ### 🍲 Aaj Kya Banayein / What to Cook - Android App
            
            Android Debug APK is ready to install!
            
            #### 📱 How to Install on Android / फोन में कैसे इनस्टॉल करें:
            1. Download `Aaj-Kya-Banayein-debug.apk` directly on your Android phone.
            2. Tap the downloaded file in your **Downloads** or notification bar.
            3. If prompted, allow *"Install unknown apps" / "अज्ञात ऐप्स इंस्टॉल करें"*.
            4. Tap **Install** and enjoy the app!
            
            ---
            *Built automatically via GitHub Actions.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
